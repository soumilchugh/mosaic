name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mosaic_test
          POSTGRES_USER: mosaic
          POSTGRES_PASSWORD: mosaic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mosaic -d mosaic_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MOSAIC_DATABASE_URL: postgresql+psycopg://mosaic:mosaic@localhost:5432/mosaic_test
      MOSAIC_TEST_DATABASE_URL: postgresql+psycopg://mosaic:mosaic@localhost:5432/mosaic_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrate database
        run: alembic upgrade head
      - name: Test
        run: pytest
      - name: Verify migration round trip
        run: alembic downgrade base && alembic upgrade head && alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build service images
        run: docker compose build web api worker
