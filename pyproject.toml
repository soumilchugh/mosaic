[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Local-first deep research agent harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/harness_core/src/harness_core",
  "packages/research_core/src/research_core",
  "services/api/src/api",
  "services/worker/src/worker",
]

[tool.pytest.ini_options]
testpaths = [
  "packages/harness_core/tests",
  "packages/research_core/tests",
  "services/api/tests",
  "services/worker/tests",
]
pythonpath = [
  "packages/harness_core/src",
  "packages/research_core/src",
  "services/api/src",
  "services/worker/src",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
